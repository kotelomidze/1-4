şdə uzun müddət davam edən və ya təkrarlanan hərəkəti bildirir.`,tableHead:[`აწმყო`,`უწყვეტელი`],table:[[`წერს / წერენ`,`წერდა / წერდნენ`],[`კითხულობს`,`კითხულობდა`],[`ამზადებს`,`ამზადებდა`],[`აბარებს`,`აბარებდა`],[`სწავლობს`,`სწავლობდა`],[`ისვენებს`,`ისვენებდა`],[`ლაპარაკობს`,`ლაპარაკობდა`],[`დადის / გადის`,`დადიოდა / გადიოდა`],[`მთავრდება`,`მთავრდებოდა`],[`აინტერესებს`,`აინტერესებდა`],[`აქვს`,`ჰქონდა`],[`ჰყავს`,`ჰყავდა`]]},{id:`agreement`,titleKa:`პირის ნიშნები და რიცხვში შეთანხმება`,ka:`რიცხვითი სახელის (ორი, სამი), „ბევრი“-სა და „ყველა“-ს შემდეგ არსებითი სახელი მხოლობით რიცხვშია და ზმნაც მხოლობით რიცხვშია: ორი სტუდენტი აბარებს. მრავლობითი რიცხვის სახელს (სტუდენტები) მრავლობითი ზმნა მოსდევს: სტუდენტები აბარებენ.`,hy:`Թվականից (ორი, სამი), „ბევრი“ (շատ) և „ყველა“ (բոլոր) բառերից հետո գոյականը դրվում է եզակի թվով, և բայը նույնպես եզակի է. ორი სტუდენტი აბარებს (Երկու ուսանող հանձնում է): Հոգնակի գոյականից (სტუდენტები) հետո բայը հոգնակի է. სტუდენტები აბარებენ:`,az:`Saydan (ორი, სამი), „ბევრი“ (çox) və „ყველა“ (hamı) sözlərindən sonra isim tək olur, fel də tək olur: ორი სტუდენტი აბარებს (İki tələbə imtahan verir). Cəmdə olan isimdən (სტუდენტები) sonra fel cəmdə olur: სტუდენტები აბარებენ.`,tableHead:[`მხოლობითი`,`მრავლობითი`],table:[[`ის აბარებს / აბარებდა`,`ისინი აბარებენ / აბარებდნენ`],[`მას აქვს / ჰქონდა`,`მათ აქვთ / ჰქონდათ`],[`მას ჰყავს`,`მათ ჰყავთ`],[`მას აინტერესებს`,`მათ აინტერესებთ`],[`ორი სტუდენტი აბარებს`,`სტუდენტები აბარებენ`],[`ბევრ სტუდენტს აქვს`,`სტუდენტებს აქვთ`]]},{id:`adverbial`,titleKa:`ვითარებითი ბრუნვა: -ად`,ka:`ზედსართავი სახელი პასუხობს კითხვას „როგორი?“ (თავისუფალი ადგილი). -ად ნიშნით ვიღებთ ზმნიზედას, რომელიც პასუხობს კითხვას „როგორ?“ (თავისუფლად ლაპარაკობს). ზოგჯერ ფუძე იკვეცება: თავისუფალი ➔ თავისუფლად.`,hy:`Ածականը պատասխանում է „როგორი?“ (ինչպիսի՞) հարցին. თავისუფალი ადგილი (ազատ տեղ): -ად վերջավորությամբ ստանում ենք մակբայ, որը պատասխանում է „როგორ?“ (ինչպե՞ս) հարցին. თავისუფლად ლაპარაკობს (ազատ խոսում է): Երբեմն հիմքը կրճատվում է. თავისუფალი ➔ თავისუფლად:`,az:`Sifət „როგორი?“ (necə? hansı?) sualına cavab verir: თავისუფალი ადგილი (boş yer). -ად şəkilçisi ilə zərf alırıq, o „როგორ?“ (necə?) sualına cavab verir: თავისუფლად ლაპარაკობს (sərbəst danışır). Bəzən kök qısalır: თავისუფალი ➔ თავისუფლად.`,tableHead:[`როგორი?`,`როგორ? (-ად)`],table:[[`თავისუფალი`,`თავისუფლად`],[`აქტიური`,`აქტიურად`],[`ენერგიული`,`ენერგიულად`],[`სწორი`,`სწორად`],[`სპორტული`,`სპორტულად`],[`კარგი`,`კარგად`]]},{id:`postpositions`,titleKa:`თანდებულები: -ში, -ზე, -დან, -მდე`,ka:`-ში — შიგნით (ზუმში, ფილმში, სოციალურ ქსელებში). -ზე — ზემოთ ან ღონისძიებაზე (ლექციაზე, ზღვაზე, არხზე, დისკზე). -დან / -იდან — საიდან? (ბათუმიდან, კომპიუტერიდან). -მდე — სადამდე? (გორამდე, შვიდ საათამდე). -დან-ის წინ ფუძე ხშირად იკვეცება: სოფელი ➔ სოფლიდან, მატარებელი ➔ მატარებლიდან, წელი ➔ წლიდან, საქმე ➔ საქმიდან.`,hy:`-ში — ներսում (ზუმში — Zoom-ում, ფილმში — ֆիլմում): -ზე — վրա կամ միջոցառման ժամանակ (ლექციაზე — դասախոսության ժամանակ, ზღვაზე — ծովափին, არხზე — ալիքով): -დან / -იდან — որտեղի՞ց (ბათუმიდან — Բաթումից): -მდე — մինչև ո՞ւր (გორამდე — մինչև Գորի): -დან-ից առաջ հիմքը հաճախ կրճատվում է. სოფელი ➔ სოფლიდან, მატარებელი ➔ მატარებლიდან, წელი ➔ წლიდან, საქმე ➔ საქმიდან:`,az:`-ში — içində (ზუმში — Zoom-da, ფილმში — filmdə). -ზე — üstündə və ya tədbirdə (ლექციაზე — mühazirədə, ზღვაზე — dəniz kənarında, არხზე — kanalda). -დან / -იდან — haradan? (ბათუმიდან — Batumidən). -მდე — haraya qədər? (გორამდე — Qoriyə qədər). -დან-dan əvvəl kök çox vaxt qısalır: სოფელი ➔ სოფლიდან, მატარებელი ➔ მატარებლიდან, წელი ➔ წლიდან, საქმე ➔ საქმიდან.`,examples:[`ახლა ჩვენ ლექციაზე ვართ.`,`სტუდენტები ზღვაზე ისვენებენ.`,`ხვალ შეხვედრა გვაქვს ზუმში.`,`თბილისიდან გორამდე 80 კილომეტრია.`]},{id:`suffix`,titleKa:`სუფიქსი -ურ / -ულ`,ka:`-ურ / -ულ სუფიქსით სახელიდან ვაწარმოებთ ზედსართავს: კაცი ➔ კაცური, ხალხი ➔ ხალხური. თუ სიტყვაში არის რ ბგერა, -ურ-ის ნაცვლად ვწერთ -ულ-ს: კულტურა ➔ კულტურული, ტრადიცია ➔ ტრადიციული, სპორტი ➔ სპორტული.`,hy:`-ურ / -ულ ածանցով գոյականից կազմում ենք ածական. კაცი ➔ კაცური (տղամարդկային), ხალხი ➔ ხალხური (ժողովրդական): Եթե բառում կա რ հնչյունը, -ურ-ի փոխարեն գրում ենք -ულ. კულტურა ➔ კულტურული, ტრადიცია ➔ ტრადიციული, სპორტი ➔ სპორტული:`,az:`-ურ / -ულ şəkilçisi ilə isimdən sifət düzəldirik: კაცი ➔ კაცური (kişi kimi), ხალხი ➔ ხალხური (xalq). Sözdə რ səsi varsa, -ურ əvəzinə -ულ yazırıq: კულტურა ➔ კულტურული, ტრადიცია ➔ ტრადიციული, სპორტი ➔ სპორტული.`,tableHead:[`სახელი`,`-ურ / -ულ`],table:[[`ბავშვი`,`ბავშვური`],[`ჯგუფი`,`ჯგუფური`],[`მოდა`,`მოდური`],[`სტრესი`,`სტრესული`],[`კულტურა`,`კულტურული`],[`ახალგაზრდა`,`ახალგაზრდული`]]},{id:`genitive`,titleKa:`ნათესაობითი ბრუნვა: -ის`,ka:`ნათესაობითი ბრუნვა (-ის) პასუხობს კითხვას „რისი? ვისი?“: ფეხბურთის მოედანი, სკოლის დირექტორი. ა-ზე და ე-ზე დაბოლოებული სახელები ხმოვანს კარგავენ: მანქანა ➔ მანქანის, საქმე ➔ საქმის. ზოგჯერ ფუძე იკვეცება: მატარებელი ➔ მატარებლის, წელი ➔ წლის.`,hy:`ნათესაობითი ბრუნვა-ն (սեռական հոլով, -ის) պատասխանում է „რისი? ვისი?“ (ինչի՞, ու՞մ) հարցին. ფეხბურთის მოედანი (ֆուտբոլի դաշտ), სკოლის დირექტორი (դպրոցի տնօրեն): -ა և -ე վերջավորությամբ բառերը կորցնում են ձայնավորը. მანქანა ➔ მანქანის, საქმე ➔ საქმის: Երբեմն հիմքը կրճատվում է. მატარებელი ➔ მატარებლის, წელი ➔ წლის:`,az:`ნათესაობითი ბრუნვა (yiyəlik hal, -ის) „რისი? ვისი?“ (nəyin? kimin?) sualına cavab verir: ფეხბურთის მოედანი (futbol meydançası), სკოლის დირექტორი (məktəbin direktoru). -ა və -ე ilə bitən isimlər saiti itirir: მანქანა ➔ მანქანის, საქმე ➔ საქმის. Bəzən kök qısalır: მატარებელი ➔ მატარებლის, წელი ➔ წლის.`,examples:[`ფეხბურთის მოედანი`,`მანქანის საჭე`,`მატარებლის ვაგონი`,`სასწავლო წლის ბოლოს`]},{id:`frequency`,titleKa:`რამდენად ხშირად?`,ka:`ყოველთვის ➔ ყოველდღე ➔ ხშირად ➔ ზოგჯერ / ხანდახან ➔ იშვიათად ➔ არასდროს / არასოდეს. „ზოგჯერ“ და „ხანდახან“ ერთსა და იმავეს ნიშნავს, ასევე „არასდროს“ და „არასოდეს“.`,hy:`ყოველთვის (միշտ) ➔ ყოველდღე (ամեն օր) ➔ ხშირად (հաճախ) ➔ ზოგჯერ / ხანდახან (երբեմն) ➔ იშვიათად (հազվադեպ) ➔ არასდროს / არასოდეს (երբեք): „ზოგჯერ“-ը և „ხანდახან“-ը նույն իմաստն ունեն, ինչպես նաև „არასდ ik/yönlük hal (-ს)`}},{id:`p1_ex2_4`,prompt:`4) ცნობილი მსახიობი თამაშობს ამ (ფილმი) ______.`,promptTranslation:{hy:`4) Հայտնի դերասանը խաղում է այս ֆիլմում:`,az:`4) Məşhur aktyor bu filmdə oynayır:`},expectedAnswer:`ფილმში`,hint:{ka:`თანდებული: -ში (შიგნით)`,hy:`Կապ՝ -ში (մեջ)`,az:`Qoşma: -ში (içində)`}},{id:`p1_ex2_5`,prompt:`5) ამ (სპექტაკლი) ______ თამაშობს ჩემი მეგობარი.`,promptTranslation:{hy:`5) Այս ներկայացման մեջ խաղում է իմ ընկերը:`,az:`5) Bu tamaşada mənim dostum oynayır:`},expectedAnswer:`სპექტაკლში`,hint:{ka:`თანდებული: -ში`,hy:`Կապ՝ -ში (ներկայացման մեջ)`,az:`Qoşma: -ში (tamaşada)`}}]},{id:`p1_ex3`,number:3,part:1,title:`სავარჯიშო 3: მომავალი დროის ფორმები (მყოფადი)`,instructionKa:`მოცემულ ზმნებს მიუწერეთ მომავალი დროის (მყოფადის) შესაბამისი ფორმები:`,instructionHy:`Գրեք տրված բայերի ապառնի ժամանակի (მყოფადი) ձևերը:`,instructionAz:`Verilmiş fellərin gələcək zaman (მყოფადი) formalarını yazın:`,type:`fill_blanks`,items:[{id:`p1_ex3_1`,prompt:`ვმუშაობ ➔ მე ______ (მყოფადი)`,promptTranslation:{hy:`Ես կաշխատեմ`,az:`Mən işləyəcəyəm`},expectedAnswer:`ვიმუშავებ`},{id:`p1_ex3_2`,prompt:`ვთამაშობ ➔ ჩვენ ______ (მყოფადი)`,promptTranslation:{hy:`Մենք կխաղանք`,az:`Biz oynayacağıq`},expectedAnswer:`ვითამაშებთ`},{id:`p1_ex3_3`,prompt:`ვცხოვრობ ➔ ის ______ (მყოფადი)`,promptTranslation:{hy:`Նա կապրի`,az:`O yaşayacaq`},expectedAnswer:`იცხოვრებს`},{id:`p1_ex3_4`,prompt:`ვმოგზაურობ ➔ ისინი ______ (მყოფადი)`,promptTranslation:{hy:`Նրանք կճանապարհորդեն`,az:`Onlar səyahət edəcəklər`},expectedAnswer:`იმოგზაურებენ`},{id:`p1_ex3_5`,prompt:`ვმგზავრობ ➔ თქვენ ______ (მყოფადი)`,promptTranslation:{hy:`Դուք կուղևորվեք`,az:`Siz səfər edəcəksiniz`},expectedAnswer:`იმგზავრებთ`},{id:`p1_ex3_6`,prompt:`ვსწავლობ ➔ მე ______ (მყოფადი)`,promptTranslation:{hy:`Ես կսովորեմ`,az:`Mən öyrənəcəyəm`},expectedAnswer:`ვისწავლი`},{id:`p1_ex3_7`,prompt:`მივდივარ ➔ მე ______ (მყოფადი)`,promptTranslation:{hy:`Ես կգնամ`,az:`Mən gedəcəyəm`},expectedAnswer:`წავალ`},{id:`p1_ex3_8`,prompt:`მივდივართ ➔ ჩვენ _ :{ka:`დრო: უწყვეტელი`,hy:`Անցյալ շարունակական (უწყვეტელი)`,az:`Keçmiş davamedici zaman (უწყვეტელი)`}}]},{id:`p1_ex5`,number:5,part:1,title:`სავარჯიშო 5: სწორი დროის ფორმის არჩევა`,instructionKa:`მონიშნეთ სწორი ფორმები:`,instructionHy:`Ընտրեք բայի ճիշտ ձևը՝ հաշվի առնելով ժամանակի ցուցիչը:`,instructionAz:`Zaman zərfinə uyğun düzgün feli seçin:`,type:`multiple_choice`,items:[{id:`p1_ex5_1`,prompt:`1) ხვალ ჩვენ ყველანი ______ დაბადების დღეზე.`,options:[`მივდიოდით`,`წავალთ`],expectedAnswer:`წავალთ`,hint:{ka:`„ხვალ“ მიუთითებს მომავალ დროზე (მყოფადი)`,hy:`„ხვალ“ (վաղը) ցույց է տալիս ապառնի ժամանակ (მყოფადი)`,az:`„ხვალ“ (sabah) gələcək zamanı bildirir (მყოფადი)`}},{id:`p1_ex5_2`,prompt:`2) გუშინ ჩვენ ______ თვითმფრინავით.`,options:[`ვმგზავრობდით`,`ვიმგზავრებთ`],expectedAnswer:`ვმგზავრობდით`,hint:{ka:`„გუშინ“ მიუთითებს წარსულ დროზე (უწყვეტელი)`,hy:`„გუშინ“ (երեկ) ցույց է տալիս անցյալ ժամանակ (უწყვეტელი)`,az:`„გუშინ“ (dünən) keçmiş zamanı bildirir (უწყვეტელი)`}},{id:`p1_ex5_3`,prompt:`3) ახლა დილაა, ჯერ დრო არ მაქვს, საღამოს ______ დავალებას.`,options:[`ვწერდი`,`დავწერ`],expectedAnswer:`დავწერ`,hint:{ka:`„საღამოს“ (მომავალში) -> დავწერ`,hy:`Երեկոյան (ապագայում) -> დავწერ`,az:`Axşam (gələcəkdə) -> დავწერ`}},{id:`p1_ex5_4`,prompt:`4) ახლა დილაა, დღეს საღამომდე მშენებლები ______ საქმიანობას.`,options:[`დაასრულებენ`,`ასრულებდნენ`],expectedAnswer:`დაასრულებენ`,hint:{ka:`საღამომდე (მომავალში) -> დაასრულებენ`,hy:`Մինչև երեկո (ապագայում) -> დაასრულებენ`,az:`Axşama qədər (gələcəkdə) -> დაასრულებენ`}},{id:`p1_ex5_5`,prompt:`5) ჩვენ შარშან ______ ქვეყნის გარშემო.`,options:[`ვმოგზაურობდით`,`ვიმოგზაურებთ`],expectedAnswer:`ვმოგზაურობდით`,hint:{ka:`„შარშან“ (გასულ წელს) -> ვმოგზაურობდით`,hy:`„შარშან“ (անցյալ տարի) -> ვმოგზაურობდით`,az:`„შარშან“ (ötən il) -> ვმოგზაურობდით`}}]},{id:`p1_ex6`,number:6,part:1,title:`სავარჯიშო 6: თანდებულები (-ზე, -თვის, -ში)`,instructionKa:`ჩასვით შესაბამისი თანდებულები (-ზე, -თვის, -ში):`,instructionHy:`Տեղադրեք համապատասխան հետադիր կապերը (-ზე, -თვის, -ში):`,i ქმედებას. ხშირად ის იწარმოება აწმყოსგან ზმნისწინით: ყიდის ➔ გაყიდის, ცვლის ➔ გაცვლის, აკეთებს ➔ გააკეთებს. ზოგი ზმნის მყოფადს განსხვავებული ფორმა აქვს: ყიდულობს ➔ იყიდის. პირის ნიშნები იგივეა, რაც აწმყოში.`,hy:`მყოფადი-ն (ապառնի) ցույց է տալիս ապագայում կատարվելիք գործողություն: Հաճախ այն կազմվում է აწმყო-ից՝ ზმნისწინი-ով (նախածանցով). ყიდის ➔ გაყიდის, ცვლის ➔ გაცვლის, აკეთებს ➔ გააკეთებს: Որոշ բայեր ունեն այլ ձև. ყიდულობს ➔ იყიდის: პირის ნიშნები-ն նույնն են, ինչ აწმყო-ում:`,az:`მყოფადი (gələcək zaman) gələcəkdə ediləcək hərəkəti bildirir. Çox vaxt აწმყო-dan ზმნისწინი (önşəkilçi) ilə düzəlir: ყიდის ➔ გაყიდის, ცვლის ➔ გაცვლის, აკეთებს ➔ გააკეთებს. Bəzi fellərin fərqli forması var: ყიდულობს ➔ იყიდის. პირის ნიშნები აწმყო-dakı kimidir.`,tableHead:[`პირი`,`მყოფადი: ყიდის / ყიდულობს`],table:[[`მე`,`გავყიდი / ვიყიდი`],[`შენ`,`გაყიდი / იყიდი`],[`ის`,`გაყიდის / იყიდის`],[`ჩვენ`,`გავყიდით / ვიყიდით`],[`თქვენ`,`გაყიდით / იყიდით`],[`ისინი`,`გაყიდიან / იყიდიან`]]},{id:`prohibition`,titleKa:`აკრძალვა: ნუ`,ka:`აკრძალვას გამოვხატავთ ნაწილაკით „ნუ“ + აწმყოს ფორმა მეორე პირში: ნუ კითხულობ! ნუ წერ! ნუ აკეთებ! ნუ მიდიხარ! თავაზიანად ან ბევრთან: ნუ ყიდულობთ! ნუ მიეყრდნობით! „ნუ“ პირველ პირთან არ გამოიყენება: არა „ნუ ვყიდულობ“, არამედ „ნუ ყიდულობ“.`,hy:`Արգելքը արտահայտվում է „ნუ“ (մի՛) մասնիկով + აწმყო-ի երկրորդ դեմքի ձևով. ნუ კითხულობ! (մի՛ կարդա), ნუ წერ! (մի՛ գրիր), ნუ აკეთებ! ნუ მიდიხარ! Քաղաքավարի ձևով կամ շատերին. ნუ ყიდულობთ! ნუ მიეყრდნობით! „ნუ“-ն առաջին դեմքի հետ չի օգտագործվում. ոչ թե „ნუ ვყიდულობ“, այլ „ნუ ყიდულობ“:`,az:`Qadağa „ნუ“ ədatı + აწმყო-nun ikinci şəxs forması ilə ifadə olunur: ნუ კითხულობ! (oxuma!), ნუ წერ! (yazma!), ნუ აკეთებ! ნუ მიდიხარ! Nəzakətlə və ya çox adama: ნუ ყიდულობთ! ნუ მიეყრდნობით! „ნუ“ birinci şəxslə işlənmir: „ნუ ვყიდულობ“ yox, „ნუ ყიდულობ“.`,examples:[`ნუ ყიდულობ ამ დივანს!`,`ნუ ცვლი ფანჯარას!`,`ნუ მიეყრდნობით კარებს!`]},{id:`imperative`,titleKa:`ბრძანებითი`,ka:`ბრძანებითი ემთხვევა წყვეტილის მეორე პირის ფორმას: იყიდე! გაყიდე! გააკეთე! მოძრაობის ზმნებში: შედის ➔ შედი!, გადადის ➔ გადადი! მრავლობითში ან თავაზიანად ემატება -თ: შედით! გადით! გადადით! ჩადით! გააჩერეთ!`,hy:`ბრძანებითი-ն (հրամայական) համընկնում է წყვეტილი-ի երկրորդ դեմքի ձևի հետ. იყიდე! (գնի՛ր), გაყიდე! (վաճառի՛ր), გააკეთე! (արա՛): Շարժման բայերում. შედის ➔ შედი! (մտի՛ր), გადადის ➔ გადადი!: Հոգնակիում կամ քաղաքավարի ավելանում է -თ. შედით! გადით! გადადით! ჩადით! გააჩერეთ!`,az:`ბრძანებითი (əmr şəkli) წყვეტილი-nin ikinci şəxs forması ilə üst-üstə düşür: იყიდე! (al!), გაყიდე! (sat!), გააკეთე! (et!). Hərəkət fellərində: შედის ➔ შედი! (gir!), გადადის ➔ გადადი! Cəmdə və ya nəzakətlə -თ əlavə olunur: შედით! გადით! გადადით! ჩადით! გააჩერეთ!`,tableHead:[`აკრძალვა`,`ბრძანება`],table:[[`ნუ ყიდულობ ამ დივანს!`,`იყიდე ეს დივანი!`],[`ნუ ყიდი ამ ბინას!`,`გაყიდე ეს ბინა!`],[`ნუ ცვლი ამ მანქანას!`,`გაცვალე ეს მანქანა!`],[`ნუ აჩერებ აქ მანქანას!`,`გააჩერე აქ მანქანა!`]]},{id:`preverbs`,titleKa:`ზმნისწინები: ა-, ჩა-, გა-, გადა-, ამო-, ჩამო-, გადმო-`,ka:`ზმნისწინი აჩვენებს მოძრაობის მიმართულებას: ა- — ზემოთ (ადის), ჩა- — ქვემოთ (ჩადის), გა- — გარეთ (გადის), გადა- — მეორე მხარეს (გადადის). -მო- აჩვენებს, რომ მოძრაობა ჩვენკენ არის: ამოდის, ჩამოდის, გამოდის, გადმოდის.`,hy:`ზმნისწინი-ն (նախածանցը) ցույց է տալիս շարժման ուղղությունը. ა- — դեպի վեր (ადის՝ բարձրանում է), ჩა- — դեպի ներքև (ჩადის՝ իջնում է), გა- — դուրս (გადის՝ դուրս է գալիս), გადა- — մյուս կողմ (გადადის՝ անցնում է): -მო- ցույց է տալիս, որ շարժումը դեպի մեզ է. ამოდის, ჩამოდის, გამოდის, გადმოდის:`,az:`ზმნისწინი (önşəkilçi) hərəkətin istiqamətini göstərir: ა- — yuxarı (ადის — qalxır), ჩა- — aşağı (ჩადის — enir), გა- — çölə (გადის — çıxır), გადა- — o biri tərəfə (გადადის — keçir). -მო- hərəkətin bizə doğru olduğunu göstərir: ამოდის, ჩამოდის, გამოდის, გადმოდის.`,tableHead:[`ჩვენგან`,`ჩვენკენ (-მო-)`],table:[[`ადის / ავიდა`,`ამოდის / ამოვიდა`],[`ჩადის / ჩავიდა`,`ჩამოდის / ჩამოვიდა`],[`გადის / გავიდა`,`გამოდის / გამოვიდა`],[`გადადის / გადავიდა`,`გადმოდის / გადმოვიდა`]]},{id:`ian`,titleKa:`-იანი და უ-...-ო`,ka:`-იან სუფიქსი აჩვენებს, რომ რაღაც აქვს: მარილიანი, აივნიანი, ორსართულიანი. უ-...-ო აჩვენებს, რომ არ აქვს: უმარილო, უფულო. ზოგჯერ ფუძე იკვეცება ან ბოლო ხმოვანი იკარგება: ფანჯარა ➔ ფანჯრიანი, შაქარი ➔ შაქრიანი, მანქანა ➔ მანქანიანი, მზე ➔ მზიანი.`,hy:`-იან ածանցը ցույց է տալիս «ունեցող». მარილიანი (աղով), აივნიანი (պատշգամբով), ორსართულიანი (երկհարկանի): უ-...-ო ցույց է տալիս «չունեցող». უმარილო (անաղ), უფულო (անփող): Երբեմն հիմքը կրճատվում է կամ վերջին ձայնավորն ընկնում է. ფანჯარა ➔ ფანჯრიანი, შაქარი ➔ შაქრიანი, მანქანა ➔ მანქანიანი, მზე ➔ მზიანი:`,az:`-იან şəkilçisi «olan» mənasını verir: მარილიანი (duzlu), აივნიანი (eyvanlı), ორსართულიანი (ikimərtəbəli). უ-...-ო «olmayan» mənasını verir: უმარილო (duzsuz), უფულო (pulsuz). Bəzən kök qısalır və ya son sait düşür: ფანჯარა ➔ ფანჯრიანი, შაქარი ➔ შაქრიანი, მანქანა ➔ მანქანიანი, მზე ➔ მზიანი.`,tableHead:[`აქვს (-იანი)`,`არ აქვს (უ-...-ო)`],table:[[`მარილიანი`,`უმარილო`],[`შაქრიანი`,`უშაქრო`],[`ფულიანი`,`უფულო`],[`მზიანი`,`უმზეო`],[`აივნიანი`,`უაივნო`]]},{id:`postpositions`,titleKa:`თანდებულები: -ში, -ზე, -თან`,ka:`-ში — შიგნით ან მანძილი: თბილისში, ცენტრში, ხუთას მეტრში, ორ კილომეტრში. -ზე — ზედაპირზე ან ადგილზე: მეორე სართულზე, ტაბიძის ქუჩაზე, პირველ ხაზზე, შუქნიშანზე. -თან — სიახლოვე: სახლთან ახლოს, თბილისთან ახლოს, სასტუმროსთან.`,hy:`-ში — ներսում կամ հեռավորություն. თბილისში (Թբիլիսիում), ცენტრში (կենտրոնում), ხუთას მეტრში (հինգ հարյուր մետրից): -ზე — վրա կամ տեղում. მეორე სართულზე (երկրորդ հարկում), ტაბიძის ქუჩაზე (Տաբիձե փողոցում), შუქნიშანზე (լուսացույցի մոտ): -თან — մոտիկություն. სახლთან ახლოს (տան մոտ), თბილისთან ახლოს (Թբիլիսիի մոտ):`,az:`-ში — içində və ya məsafə: თბილისში (Tbilisidə), ცენტრში (mərkəzdə), ხუთას მეტრში (beş yüz metrdən sonra). -ზე — üstündə və ya yerdə: მეორე სართულზე (ikinci mərtəbədə), ტაბიძის ქუჩაზე (Tabidze küçəsində), შუქნიშანზე (svetoforda). -თან — yaxınlıq: სახლთან ახლოს (evin yanında), თბილისთან ახლოს (Tbilisinin yanında).`,examples:[`ნინო ცხოვრობს მეორე სართულზე.`,`უნივერსიტეტი ქალაქის ცენტრშია.`, şlayır.`,category:`phrase`},{ka:`რომელ საათამდე მუშაობს სავაჭრო ცენტრი?`,hy:`Մինչև ժամը քանիսն է աշխատում առևտրի կենտրոնը:`,az:`Ticarət mərkəzi saat neçəyədək işləyir?`,category:`phrase`},{ka:`აიღეთ ხურდა.`,hy:`Վերցրեք մանրը:`,az:`Qalığı götürün.`,category:`phrase`},{ka:`ინებეთ ხურდა.`,hy:`Խնդրեմ, ձեր մանրը:`,az:`Buyurun, qalıq.`,category:`phrase`},{ka:`პიჯაკი`,hy:`պիջակ`,az:`pencək`,category:`noun`},{ka:`პულოვერი`,hy:`պուլովեր`,az:`pulover`,category:`noun`},{ka:`კაშნე`,hy:`շարֆ, վզնոց`,az:`şərf`,category:`noun`},{ka:`ხელთათმანი`,hy:`ձեռնոց`,az:`əlcək`,category:`noun`},{ka:`სუნამო`,hy:`օծանելիք`,az:`ətir`,category:`noun`},{ka:`გაზომვა`,hy:`չափելը (հագուստը փորձելը)`,az:`ölçmə (paltarı geyinib baxmaq)`,category:`noun`},{ka:`მყიდველი`,hy:`գնորդ`,az:`alıcı`,category:`noun`},{ka:`ვიზიტორი`,hy:`այցելու`,az:`ziyarətçi`,category:`noun`},{ka:`ხარისხიანი`,hy:`որակյալ`,az:`keyfiyyətli`,category:`adjective`},{ka:`მშვენიერი`,hy:`հրաշալի`,az:`gözəl, əla`,category:`adjective`},{ka:`უხარისხო`,hy:`անորակ`,az:`keyfiyyətsiz`,category:`adjective`},{ka:`იკეტება`,hy:`փակվում է`,az:`bağlanır`,category:`verb`},{ka:`იღება`,hy:`բացվում է`,az:`açılır`,category:`verb`},{ka:`იღებს`,hy:`վերցնում է, ստանում է`,az:`götürür, alır`,category:`verb`},{ka:`ყიდულობს`,hy:`գնում է`,az:`alır`,category:`verb`},{ka:`ყიდის`,hy:`վաճառում է`,az:`satır`,category:`verb`}],It=[{id:`demonstratives`,titleKa:`ეს / ეგ / ის და ამ / მაგ / იმ`,ka:`ეს — ახლოს არის ჩემთან (ვინც ლაპარაკობს): ეს წიგნი, ხელში რომ მიჭირავს. ეგ — ახლოს არის შენთან (ვისაც ველაპარაკები): ეგ კალამი, შენ გვერდით რომ დევს. ის — შორს არის ან აქ არ არის: ის გოგო, გუშინ რომ ველაპარაკებოდი. სახელის წინ სახელობითის გარდა სხვა ბრუნვებში: ეს ➔ ამ, ეგ ➔ მაგ, ის ➔ იმ: ამ წიგნს, მაგ კაბას, იმ მაღაზიაში.`,hy:`ეს — մոտ է ինձ (խոսողին). ეს წიგნი (այս գիրքը), ხელში რომ მიჭირავს: ეგ — մոտ է քեզ (ում հետ խոսում եմ). ეგ კალამი (այդ գրիչը), შენ გვერდით რომ დევს: ის — հեռու է կամ այստեղ չէ. ის გოგო (այն աղջիկը): Գոյականից առաջ, სახელობითი-ից բացի մյուս հոլովներում. ეს ➔ ამ, ეგ ➔ მაგ, ის ➔ იმ. ამ წიგნს, მაგ კაბას, იმ მაღაზიაში:`,az:`ეს — mənə (danışana) yaxındır: ეს წიგნი (bu kitab), ხელში რომ მიჭირავს. ეგ — sənə (danışdığım adama) yaxındır: ეგ კალამი (o qələm — sənin yanındakı). ის — uzaqdadır və ya burada deyil: ის გოგო (o qız). İsimdən əvvəl სახელობითი-dən başqa hallarda: ეს ➔ ამ, ეგ ➔ მაგ, ის ➔ იმ: ამ წიგნს, მაგ კაბას, იმ მაღაზიაში.`,tableHead:[`სახელობითი`,`სხვა ბრუნვები`],table:[[`ეს წიგნი საინტერესოა.`,`ამ წიგნს წავიკითხავ ხვალ.`],[`ეგ ძაღლი ვისია?`,`მაგ ძაღლს გრძელი კუდი აქვს.`],[`ის გოგო კარგად სწავლობს.`,`იმ გოგოს ლურჯი თვალები აქვს.`]]},{id:`mo`,titleKa:`მიდის / მოდის; ადის / ამოდის`,ka:`მოძრაობის ზმნაში -მო- აჩვენებს, რომ მოძრაობა ჩვენკენ (ლაპარაკის ადგილისკენ) არის: მიდის — ჩვენგან, მოდის — ჩვენკენ. მე მე-9 სართულზე ვცხოვრობ, მარიამი ჩემთან ამოდის. ის ჩემთან ჩამოდის (სოფელში). მზე ამოდის და ჩადის.`,hy:`Շարժման բայում -მო- ցույց է տալիս, որ շարժումը դեպի մեզ է (խոսողի տեղը). მიდის — մեզանից (գնում է), მოდის — դեպի մեզ (գալիս է): მე მე-9 სართულზე ვცხოვრობ, მარიამი ჩემთან ამოდის (բարձրանում է ինձ մոտ): ის ჩემთან ჩამოდის (իջնում/գալիս է ինձ մոտ): მზე ამოდის (արևը ծագում է) და ჩადის (մայր է մտնում):`,az:`Hərəkət felində -მო- hərəkətin bizə (danışanın yerinə) doğru olduğunu göstərir: მიდის — bizdən (gedir), მოდის — bizə doğru (gəlir). მე მე-9 სართულზე ვცხოვრობ, მარიამი ჩემთან ამოდის (yanıma qalxır). ის ჩემთან ჩამოდის (yanıma gəlir). მზე ამოდის (günəş doğur) და ჩადის (batır).`,tableHead:[`ჩვენგან`,`ჩვენკენ (-მო-)`],table:[[`მიდის`,`მოდის`],[`ადის`,`ამოდის`],[`ჩადის`,`ჩამოდის`],[`გადის`,`გამოდის`],[`წავა`,`წამოვა`]]},{id:`motion-future`,titleKa:`მოძრაობის ზმნები მყოფადში`,ka:`აწმყოში: ავდივარ, ადიხარ, ადის… მყოფადში ფუძე იცვლება: ავალ, ახვალ, ავა, ავალთ, ახვალთ, ავლენ. ასევე: ჩავდივარ ➔ ჩავალ, შევდივარ ➔ შევალ, გავდივარ ➔ გავალ, გადავდივარ ➔ გადავალ, მივდივარ ➔ წავალ / მივალ, გამოვდივარ ➔ გამოვალ.`,hy:`აწმყო-ում. ავდივარ, ადიხარ, ადის… მყოფადი-ում հիմքը փոխվում է. ავალ, ახვალ, ავა, ავალთ, ახვალთ, ავლენ: Նույնպես. ჩავდივარ ➔ ჩავალ, შევდივარ ➔ შევალ, გავდივარ ➔ გავალ, გადავდივარ ➔ გადავალ, მივდივარ ➔ წავალ / მივალ, გამოვდივარ ➔ გამოვალ:`,az:`აწმყო-da: ავდივარ, ადიხარ, ადის… მყოფადი-da kök dəyişir: ავალ, ახვალ, ავა, ავალთ, ახვალთ, ავლენ. Həmçinin: ჩავდივარ ➔ ჩავალ, შევდივარ ➔ შევალ, გავდივარ ➔ გავალ, გადავდივარ ➔ გადავალ, მივდივარ ➔ წავალ / მივალ, გამოვდივარ ➔ გამოვალ.`,tableHead:[`პირი`,`აწმყო`,`მყოფადი`],table:[[`მე`,`ავდივარ`,`ავალ`],[`შენ`,`ადიხარ`,`ახვალ`],[`ის`,`ადის`,`ავა`],[`ჩვენ`,`ავდივართ`,`ავალთ`],[`თქვენ`,`ადიხართ`,`ახვალთ`],[`ისინი`,`ადიან`,`ავლენ`]]},{id:`sa-o`,titleKa:`სა-ო წარმოება`,ka:`სა-ო აფიქსებით ვაწარმოებთ სიტყვებს, რომლებიც აჩვენებს, რისთვის არის რაღაც ან რას ეკუთვნის: სადილი ➔ სასადილო, მგზავრი ➔ სამგზავრო (ჩანთა), შემოდგომა ➔ საშემოდგომო (ფასდაკლება), ახალი წელი ➔ საახალწლო (ნაძვისხე). ფუძის ბოლო ხმოვანი იკარგება: ფეხბურთი ➔ საფეხბურთო, შემოდგომა ➔ საშემოდგომო.`,hy:`სა-ო ածանցներով կազմում ենք բառեր, որոնք ցույց են տալիս, թե ինչի համար է առարկան կամ ինչին է վերաբերում. სადილი ➔ სასადილო (ճաշարան), მგზავრი ➔ სამგზავრო (ճամփորդական պայուսակ), შემოდგომა ➔ საშემოდგომო (աշնանային զեղչ), ახალი წელი ➔ საახალწლო (ամանորյա տոնածառ): Հիմքի վերջին ձայնավորն ընկնում է. ფეხბურთი ➔ საფეხბურთო, შემოდგომა ➔ საშემოდგომო:`,az:`სა-ო şəkilçiləri ilə bir şeyin nə üçün olduğunu və ya nəyə aid olduğunu göstərən sözlər düzəldirik: სადილი ➔ სასადილო (yeməkxana), მგზავრი ➔ სამგზავრო (səyahət çantası), შემოდგომა ➔ საშემოდგომო (payız endirimi), ახალი წელი ➔ საახალწლო (yeni il küknarı). Kökün son saiti düşür: ფეხბურთი ➔ საფეხბურთო, შემოდგომა ➔ საშემოდგომო.`,examples:[`საფეხბურთო ბურთი`,`სამგზავრო ჩანთა`,`საინფორმაციო დაფა`,`საგაზაფხულო ფასდაკლება`,`საბანკო ამონაწერი`]},{id:`conditional`,titleKa:`პირობითობა: თუ + მყოფადი`,ka:`კავშირი „თუ“ გამოხატავს პირობას. თუ მოქმედება მომავალშია, ორივე ნაწილში ზმნა მყოფადშია: თუ დღეს იყიდი ბილეთებს, ხვალ წავალთ ბათუმში. თუ მარიამი მოიტანს საღებავებს, შენ დახატავ სურათს.`,hy:`„თუ“ (եթե) շաղկապն արտահայտում է պայման: Եթե գործողությունն ապագայում է, երկու մասերում էլ բայը მყოფადი-ով է. თუ დღეს იყიდი ბილეთებს, ხვალ წავალთ ბათუმში (Եթե այսօր գնես տոմսերը, վաղը կգնանք Բաթում): თუ მარიამი მოიტანს საღებავებს, შენ დახატავ სურათს:`,az:`„თუ“ (əgər) bağlayıcısı şərt bildirir. Hərəkət gələcəkdədirsə, hər iki hissədə fel მყოფადი-dadır: თუ დღეს იყიდი ბილეთებს, ხვალ წავალთ ბათუმში (Əgər bu gün biletləri alsan, sabah Batumiyə gedəcəyik). თუ მარიამი მოიტანს საღებავებს, შენ დახატავ სურათს.`,examples:[`თუ გამოცდებს კარგად ჩააბარებ, მეც წამოვალ.`,`თუ დროზე დავასრულებ პროექტს, გავაკეთებ პრეზენტაციას.`]},{id:`comparison`,titleKa:`შედარება: -ზე, ყველაზე, -ით`,ka:`შედარებისთვის ვიყენებთ -ზე თანდებულს: ანა ლეილაზე მაღალია. აღმატებითი ხარისხი: ყველაზე მაღალი, ყველაზე დაბალი ფასები, ყველაზე მაღალი ხარისხი. სხვაობას ვაჩვენებთ მოქმედებითი ბრუნვით (-ით): მარიამი ჩემზე სამი წლით უფროსია (სამი წელი ➔ სამი წლით). -ით აჩვენებს იარაღსაც: კალმით წერს, მარჯვენა ხელით აკეთებს.`,hy:`Համեմատության համար օգտագործում ենք -ზე թանդեբուլը. ანა ლეილაზე მაღალია (Աննան Լեյլայից բարձրահասակ է): აღმატებითი ხარისხი (գերադրական աստիճան). ყველაზე მაღალი (ամենաբարձր), ყველაზე დაბალი ფასები (ամենացածր գները): Տարբերությունը ցույց ենք տալիս მოქმედებითი հոլովով (-ით). მარიამი ჩემზე სამი წლით უფროსია (Մարիամն ինձանից երեք տարով մեծ է): -ით-ը ցույց է տալիս նաև գործիքը. კალმით წერს (գրչով է գրում), მარჯვენა ხელით (աջ ձեռքով):`,az:`Müqayisə üçün -ზე qoşmasından istifadə edirik: ანა ლეილაზე მაღალია (Anna Leyladan hündürdür). აღმატებითი ხარისხი (üstünlük dərəcəsi): ყველაზე მაღალი (ən hündür), ყველაზე დაბალი ფასები (ən aşağı qiymətlər). Fərqi მოქმედებითი hal (-ით) ilə göstəririk: მარიამი ჩემზე სამი წლით უფროსია (Məryəm məndən üç yaş böyükdür). -ით alət də bildirir: კალმით წერს (qələmlə yazır), მარჯვენა ხელით (sağ əllə).`,examples:[`ლუკა ჩემზე ორი წლით უმცროსია.`,`ამათგან ყველაზე მაღალი ანაა.`,`გიორგი ფანქრით წერს.`]},{id:`new-verbs-future`,titleKa:`ახალი ზმნები მყოფადში`,ka:`ამ თემის ზმნები მყოფადში ზმნისწინს იღებს: ყიდულობს ➔ იყიდის, ყიდის ➔ გაყიდის, იხდის (ფულს) ➔ გადაიხდის, იხდ

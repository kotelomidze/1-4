 ya təkrarlanan hərəkəti bildirir.`,tableHead:[`აწმყო`,`უწყვეტელი`],table:[[`წერს / წერენ`,`წერდა / წერდნენ`],[`კითხულობს`,`კითხულობდა`],[`ამზადებს`,`ამზადებდა`],[`აბარებს`,`აბარებდა`],[`სწავლობს`,`სწავლობდა`],[`ისვენებს`,`ისვენებდა`],[`ლაპარაკობს`,`ლაპარაკობდა`],[`დადის / გადის`,`დადიოდა / გადიოდა`],[`მთავრდება`,`მთავრდებოდა`],[`აინტერესებს`,`აინტერესებდა`],[`აქვს`,`ჰქონდა`],[`ჰყავს`,`ჰყავდა`]]},{id:`agreement`,titleKa:`პირის ნიშნები და რიცხვში შეთანხმება`,ka:`რიცხვითი სახელის (ორი, სამი), „ბევრი“-სა და „ყველა“-ს შემდეგ არსებითი სახელი მხოლობით რიცხვშია და ზმნაც მხოლობით რიცხვშია: ორი სტუდენტი აბარებს. მრავლობითი რიცხვის სახელს (სტუდენტები) მრავლობითი ზმნა მოსდევს: სტუდენტები აბარებენ.`,hy:`Թվականից (ორი, სამი), „ბევრი“ (շատ) և „ყველა“ (բոլոր) բառերից հետո գոյականը դրվում է եզակի թվով, և բայը նույնպես եզակի է. ორი სტუდენტი აბარებს (Երկու ուսանող հանձնում է): Հոգնակի գոյականից (სტუდენტები) հետո բայը հոգնակի է. სტუდენტები აბარებენ:`,az:`Saydan (ორი, სამი), „ბევრი“ (çox) və „ყველა“ (hamı) sözlərindən sonra isim tək olur, fel də tək olur: ორი სტუდენტი აბარებს (İki tələbə imtahan verir). Cəmdə olan isimdən (სტუდენტები) sonra fel cəmdə olur: სტუდენტები აბარებენ.`,tableHead:[`მხოლობითი`,`მრავლობითი`],table:[[`ის აბარებს / აბარებდა`,`ისინი აბარებენ / აბარებდნენ`],[`მას აქვს / ჰქონდა`,`მათ აქვთ / ჰქონდათ`],[`მას ჰყავს`,`მათ ჰყავთ`],[`მას აინტერესებს`,`მათ აინტერესებთ`],[`ორი სტუდენტი აბარებს`,`სტუდენტები აბარებენ`],[`ბევრ სტუდენტს აქვს`,`სტუდენტებს აქვთ`]]},{id:`adverbial`,titleKa:`ვითარებითი ბრუნვა: -ად`,ka:`ზედსართავი სახელი პასუხობს კითხვას „როგორი?“ (თავისუფალი ადგილი). -ად ნიშნით ვიღებთ ზმნიზედას, რომელიც პასუხობს კითხვას „როგორ?“ (თავისუფლად ლაპარაკობს). ზოგჯერ ფუძე იკვეცება: თავისუფალი ➔ თავისუფლად.`,hy:`Ածականը պատասխանում է „როგორი?“ (ինչպիսի՞) հարցին. თავისუფალი ადგილი (ազատ տեղ): -ად վերջավորությամբ ստանում ենք մակբայ, որը պատասխանում է „როგორ?“ (ինչպե՞ս) հարցին. თავისუფლად ლაპარაკობს (ազատ խոսում է): Երբեմն հիմքը կրճատվում է. თავისუფალი ➔ თავისუფლად:`,az:`Sifət „როგორი?“ (necə? hansı?) sualına cavab verir: თავისუფალი ადგილი (boş yer). -ად şəkilçisi ilə zərf alırıq, o „როგორ?“ (necə?) sualına cavab verir: თავისუფლად ლაპარაკობს (sərbəst danışır). Bəzən kök qısalır: თავისუფალი ➔ თავისუფლად.`,tableHead:[`როგორი?`,`როგორ? (-ად)`],table:[[`თავისუფალი`,`თავისუფლად`],[`აქტიური`,`აქტიურად`],[`ენერგიული`,`ენერგიულად`],[`სწორი`,`სწორად`],[`სპორტული`,`სპორტულად`],[`კარგი`,`კარგად`]]},{id:`postpositions`,titleKa:`თანდებულები: -ში, -ზე, -დან, -მდე`,ka:`-ში — შიგნით (ზუმში, ფილმში, სოციალურ ქსელებში). -ზე — ზემოთ ან ღონისძიებაზე (ლექციაზე, ზღვაზე, არხზე, დისკზე). -დან / -იდან — საიდან? (ბათუმიდან, კომპიუტერიდან). -მდე — სადამდე? (გორამდე, შვიდ საათამდე). -დან-ის წინ ფუძე ხშირად იკვეცება: სოფელი ➔ სოფლიდან, მატარებელი ➔ მატარებლიდან, წელი ➔ წლიდან, საქმე ➔ საქმიდან.`,hy:`-ში — ներսում (ზუმში — Zoom-ում, ფილმში — ֆիլմում): -ზე — վրա կամ միջոցառման ժամանակ (ლექციაზე — դասախոսության ժամանակ, ზღვაზე — ծովափին, არხზე — ալիքով): -დან / -იდან — որտեղի՞ց (ბათუმიდან — Բաթումից): -მდე — մինչև ո՞ւր (გორამდე — մինչև Գորի): -დან-ից առաջ հիմքը հաճախ կրճատվում է. სოფელი ➔ სოფლიდან, მატარებელი ➔ მატარებლიდან, წელი ➔ წლიდან, საქმე ➔ საქმიდან:`,az:`-ში — içində (ზუმში — Zoom-da, ფილმში — filmdə). -ზე — üstündə və ya tədbirdə (ლექციაზე — mühazirədə, ზღვაზე — dəniz kənarında, არხზე — kanalda). -დან / -იდან — haradan? (ბათუმიდან — Batumidən). -მდე — haraya qədər? (გორამდე — Qoriyə qədər). -დან-dan əvvəl kök çox vaxt qısalır: სოფელი ➔ სოფლიდან, მატარებელი ➔ მატარებლიდან, წელი ➔ წლიდან, საქმე ➔ საქმიდან.`,examples:[`ახლა ჩვენ ლექციაზე ვართ.`,`სტუდენტები ზღვაზე ისვენებენ.`,`ხვალ შეხვედრა გვაქვს ზუმში.`,`თბილისიდან გორამდე 80 კილომეტრია.`]},{id:`suffix`,titleKa:`სუფიქსი -ურ / -ულ`,ka:`-ურ / -ულ სუფიქსით სახელიდან ვაწარმოებთ ზედსართავს: კაცი ➔ კაცური, ხალხი ➔ ხალხური. თუ სიტყვაში არის რ ბგერა, -ურ-ის ნაცვლად ვწერთ -ულ-ს: კულტურა ➔ კულტურული, ტრადიცია ➔ ტრადიციული, სპორტი ➔ სპორტული.`,hy:`-ურ / -ულ ածանցով գոյականից կազմում ենք ածական. კაცი ➔ კაცური (տղամարդկային), ხალხი ➔ ხალხური (ժողովրդական): Եթե բառում կա რ հնչյունը, -ურ-ի փոխարեն գրում ենք -ულ. კულტურა ➔ კულტურული, ტრადიცია ➔ ტრადიციული, სპორტი ➔ სპორტული:`,az:`-ურ / -ულ şəkilçisi ilə isimdən sifət düzəldirik: კაცი ➔ კაცური (kişi kimi), ხალხი ➔ ხალხური (xalq). Sözdə რ səsi varsa, -ურ əvəzinə -ულ yazırıq: კულტურა ➔ კულტურული, ტრადიცია ➔ ტრადიციული, სპორტი ➔ სპორტული.`,tableHead:[`სახელი`,`-ურ / -ულ`],table:[[`ბავშვი`,`ბავშვური`],[`ჯგუფი`,`ჯგუფური`],[`მოდა`,`მოდური`],[`სტრესი`,`სტრესული`],[`კულტურა`,`კულტურული`],[`ახალგაზრდა`,`ახალგაზრდული`]]},{id:`genitive`,titleKa:`ნათესაობითი ბრუნვა: -ის`,ka:`ნათესაობითი ბრუნვა (-ის) პასუხობს კითხვას „რისი? ვისი?“: ფეხბურთის მოედანი, სკოლის დირექტორი. ა-ზე და ე-ზე დაბოლოებული სახელები ხმოვანს კარგავენ: მანქანა ➔ მანქანის, საქმე ➔ საქმის. ზოგჯერ ფუძე იკვეცება: მატარებელი ➔ მატარებლის, წელი ➔ წლის.`,hy:`ნათესაობითი ბრუნვა-ն (սեռական հոլով, -ის) պատասխանում է „რისი? ვისი?“ (ինչի՞, ու՞մ) հարցին. ფეხბურთის მოედანი (ֆուտբոլի դաշտ), სკოლის დირექტორი (դպրոցի տնօրեն): -ა և -ე վերջավորությամբ բառերը կորցնում են ձայնավորը. მანქანა ➔ მანქანის, საქმე ➔ საქმის: Երբեմն հիմքը կրճատվում է. მატარებელი ➔ მატარებლის, წელი ➔ წლის:`,az:`ნათესაობითი ბრუნვა (yiyəlik hal, -ის) „რისი? ვისი?“ (nəyin? kimin?) sualına cavab verir: ფეხბურთის მოედანი (futbol meydançası), სკოლის დირექტორი (məktəbin direktoru). -ა və -ე ilə bitən isimlər saiti itirir: მანქანა ➔ მანქანის, საქმე ➔ საქმის. Bəzən kök qısalır: მატარებელი ➔ მატარებლის, წელი ➔ წლის.`,examples:[`ფეხბურთის მოედანი`,`მანქანის საჭე`,`მატარებლის ვაგონი`,`სასწავლო წლის ბოლოს`]},{id:`frequency`,titleKa:`რამდენად ხშირად?`,ka:`ყოველთვის ➔ ყოველდღე ➔ ხშირად ➔ ზოგჯერ / ხანდახან ➔ იშვიათად ➔ არასდროს / არასოდეს. „ზოგჯერ“ და „ხანდახან“ ერთსა და იმავეს ნიშნავს, ასევე „არასდროს“ და „არასოდეს“.`,hy:`ყოველთვის (միշտ) ➔ ყოველდღე (ամեն օր) ➔ ხშირად (հաճախ) ➔ ზოგჯერ / ხანდახან (երբեմն) ➔ იშვიათად (հազվադեպ) ➔ არასდროს / არასოდეს (երբեք): „ზოგჯერ“-ը և „ხანდახან“-ը նույն իմաստն ունեն, ինչպես նաև „არასდროს“-ը և „არასოდეს“-ը:`,az:`ყოველთვის (həmişə) ➔ ყოველდღე (hər gün) ➔ ხშირად (tez-tez) ➔ ზოგჯერ / ხანდახან (bəzən) ➔ იშვიათად (nadir hallarda) ➔ არასდროს / არასოდეს (heç vaxt). „ზოგჯერ“ və „ხანდახან“ eyni mənanı verir, „არასდროს“ və „არასოდეს“ də.`,examples:[`ლუკა ყოველდღე ვარჯიშობს.`,`ნინო ხშირად ამზადებს პრეზენტაციას.`,`გიორგი ზოგჯერ ისვენებს.`,`ლეილა იშვიათად წერს ქვიზს.`]}],Oe=({nativeLanguage:e})=>{let[t,n]=(0,x.useState)(De[0].id),r=De.find(e=>e.id===t)||De[0],i=e===`hy`?r.hy:e===`az`?r.az:r.ka;return(0,k.jsxs)(`div`,{className:`space-y-6`,children:[(0,k.jsx)(`div`,{className:`bg-gradient-to-r from-blue-700 via-indigo-700 to-indigo-800 rounded-3xl p-6 sm:p-8 text-white shadow-lg`,children:(0,k.jsxs)(`div`,{className:`max-w-2xl space-y-2`,children:[(0,k.jsxs)(`div`,{className:`inline-flex items-center gap-2 px-3 py-1 bg-white/10 rounded-full text-xs font-semibold text-blue-200`,children:[(0,k.jsx)(he,{className:`w-3.5 h-3.5 text-yellow-300`}),(0,k.jsx)(`span`,{children:`თემა 2: სტრესი და დღის დაგეგმვა · თეორია`})]}),(0,k.jsx)(`h2`,{className:`text-2xl sm:text-3xl font-extrabold tracking-tight`,children:e===`hy`?`Վրացերենի քերականություն. თემა 2`:e===`az`?`Gürcü dili qrammatikası: თემა 2`:`ქართული ენის გრამატიკა: თემა 2`}),(0,k.jsx)(`p`,{className:`text-sm text-blue-100 leading-relaxed`,children:e===`hy`?`Բացատրությունները տրված են հայերենով, քերականական տերմինները՝ վրացերենով:`:e===`az`?`İzahatlar azərbaycanca verilib, qrammatik terminlər isə gürcücədir.`:`განმარტებები მოცემულია არჩეულ ენაზე, გრამატიკული ტერმინები — ქართულად.`})]})}),(0,k.jsx)(`div`,{className:`flex flex-wrap gap-2 p-1.5 bg-slate-200/70 rounded-2xl`,children:De.map((e,r)=>(0,k.jsxs)(`button`,{onClick:()=>n(e.id),className:`px-3 py-2 rounded-xl text-xs font-bold transition-all ${t===e.id?`bg-white text-indigo-900 shadow-xs`:`text-slate-600 hover:text-slate-900`}`,children:[r+1,`. `,e.titleKa]},e.id))}),(0,k.jsxs)(`div`,{className:`bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 space-y-5`,children:[(0,k.jsx)(`h3`,{c ებთ`},{id:`p1_ex3_6`,prompt:`ვსწავლობ ➔ მე ______ (მყოფადი)`,promptTranslation:{hy:`Ես կսովորեմ`,az:`Mən öyrənəcəyəm`},expectedAnswer:`ვისწავლი`},{id:`p1_ex3_7`,prompt:`მივდივარ ➔ მე ______ (მყოფადი)`,promptTranslation:{hy:`Ես կգնամ`,az:`Mən gedəcəyəm`},expectedAnswer:`წავალ`},{id:`p1_ex3_8`,prompt:`მივდივართ ➔ ჩვენ ______ (მყოფადი)`,promptTranslation:{hy:`Մենք կգնանք`,az:`Biz gedəcəyik`},expectedAnswer:`წავალთ`}]},{id:`p1_ex4`,number:4,part:1,title:`სავარჯიშო 4: ზმნები „ვარჯიშობს“ და „თამაშობს“`,instructionKa:`სწორად ჩასვით ფრჩხილებში მოცემული ზმნების ვარჯიშობს (ვარჯიში) და თამაშობს (თამაში) შესაბამისი ფორმები:`,instructionHy:`Տեղադրեք ვარჯიშობს (մարզվել) և თამაშობს (խաղալ) բայերի ճիշտ ժամանակային ձևերը:`,instructionAz:`ვარჯიშობს (məşq etmək) və თამაშობს (oynamaq) fellərinin düzgün zaman formalarını yazın:`,type:`fill_blanks`,items:[{id:`p1_ex4_1`,prompt:`1) ახლა ფეხბურთელები (ვარჯიში) ______.`,promptTranslation:{hy:`Հիմա ֆուտբոլիստները մարզվում են:`,az:`İndi futbolçular məşq edirlər:`},expectedAnswer:`ვარჯიშობენ`,hint:{ka:`დრო: აწმყო (ახლა)`,hy:`Ներկա ժամանակ (აწმყო)`,az:`İndiki zaman (აწმყო)`}},{id:`p1_ex4_2`,prompt:`2) გუშინ მთელი დღე ბავშვები ეზოში (თამაში) ______.`,promptTranslation:{hy:`Երեկ ամբողջ օրը երեխաները բակում խաղում էին:`,az:`Dünən bütün gün uşaqlar həyətdə oynayırdılar:`},expectedAnswer:`თამაშობდნენ`,hint:{ka:`დრო: უწყვეტელი (გუშინ)`,hy:`Անցյալ շարունակական (უწყვეტელი)`,az:`Keçmiş davamedici zaman (უწყვეტელი)`}},{id:`p1_ex4_3`,prompt:`3) ხვალ ბავშვები სტადიონზე (ვარჯიში) ______.`,promptTranslation:{hy:`Վաղը երեխաները մարզադաշտում կմարզվեն:`,az:`Sabah uşaqlar stadionda məşq edəcəklər:`},expectedAnswer:`ივარჯიშებენ`,hint:{ka:`დრო: მყოფადი (ხვალ)`,hy:`Ապառնի (მყოფადი)`,az:`Gələcək zaman (მყოფადი)`}},{id:`p1_ex4_4`,prompt:`4) ერთი თვის შემდეგ ჩვენი გუნდი (თამაში) ______ ამხანაგურ მატჩს.`,promptTranslation:{hy:`Մեկ ամիս անց մեր թիմը կխաղա ընկերական խաղ:`,az:`Bir aydan sonra bizim komandamız yoldaşlıq oyunu oynayacaq:`},expectedAnswer:`ითამაშებს`,hint:{k ზაურობდით`,hy:`„შარშან“ (անցյալ տարի) -> ვმოგზაურობდით`,az:`„შარშან“ (ötən il) -> ვმოგზაურობდით`}}]},{id:`p1_ex6`,number:6,part:1,title:`სავარჯიშო 6: თანდებულები (-ზე, -თვის, -ში)`,instructionKa:`ჩასვით შესაბამისი თანდებულები (-ზე, -თვის, -ში):`,instructionHy:`Տեղադրեք համապատասխան հետադիր կապերը (-ზე, -თვის, -ში):`,instructionAz:`Müvafiq sonluq qoşmaları yazın (-ზე, -თვის, -ში):`,type:`fill_blanks`,items:[{id:`p1_ex6_1`,prompt:`1) ისინი ჩემ______ ბევრს ლაპარაკობენ.`,promptTranslation:{hy:`Նրանք իմ մասին շատ են խոսում:`,az:`Onlar mənim haqqımda çox danışırlar:`},expectedAnswer:`ზე`,hint:{ka:`ჩემზე (իմ մասին / mənim haqqımda)`,hy:`ჩემზე (մասին)`,az:`ჩემზე (haqqımda)`}},{id:`p1_ex6_2`,prompt:`2) ეს ფანქრები ჩემ______ მინდა.`,promptTranslation:{hy:`Այս մատիտներն ինձ համար եմ ուզում:`,az:`Bu karandaşları özüm üçün istəyirəm:`},expectedAnswer:`თვის`,hint:{ka:`ჩემთვის (ինձ համար / mənim üçün)`,hy:`ჩემთვის (համար)`,az:`ჩემთვის (üçün)`}},{id:`p1_ex6_3`,prompt:`3) ჩემს ჩანთა______ ბევრი წიგნი დევს.`,promptTranslation:{hy:`Իմ պայուսակում շատ գրքեր կան:`,az:`Mənim çantamda çoxlu kitab var:`},expectedAnswer:`ში`,hint:{ka:`ჩანთაში (պայուսակում / çantada)`,hy:`ჩანთაში (մեջ)`,az:`ჩანთაში (içində)`}},{id:`p1_ex6_4`,prompt:`4) ლუკა ჩემ______ ერთი წლით დიდია.`,promptTranslation:{hy:`Ղուկասն ինձնից մեկ տարով մեծ է:`,az:`Luka məndən bir yaş böyükdür:`},expectedAnswer:`ზე`,hint:{ka:`ჩემზე დიდია (համեմատություն / müqayisə)`,hy:`ჩემზე (ինձնից մեծ)`,az:`ჩემზე (məndən böyük)`}}]},{id:`p1_ex7`,number:7,part:1,title:`სავარჯიშო 7: „აქვს“ თუ „ჰყავს“?`,instructionKa:`მონიშნეთ სწორი ფორმები (აქვს უსულოსთვის, ჰყავს სულიერისთვის):`,instructionHy:`Ընտրեք „აქვს“ (անշունչ առարկա) կամ „ჰყავს“ (շնչավոր անձ/կենդանի):`,instructionAz:`Düzgün formanı seçin: „აქვს“ (cansız üçün), „ჰყავს“ (canlı üçün):`,type:`multiple_choice`,items:[{id:`p1_ex7_1`,prompt:`1) მარიამი კარგი მოსწავლე იყო, მას ______ ოქროს მედალი.`,options:[`აქვს`,`ჰყავს`],expectedAnswer:`აქვს`,hint:{ka:`მედალი უსულო საგანია ➔ აქვს`,hy:`Մեդալն ան
